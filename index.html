<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data Tabungan</title>
    <link rel="icon" href="favicon.ico?v=inputtabungan">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #f4f4f9;
            --accent-color: #4A90E2;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--primary-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header & Footer */
        .header, .footer {
            width: 100%;
            height: 150px;
            background-image: url('https://lh3.googleusercontent.com/d/1oJutXLpusTRerjiQ_5QfXLsyV33NTuOG'); 
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .header h1 { 
            margin: 0; 
            font-family: 'Righteous', cursive;
            font-size: 36px; 
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 2px 4px 8px rgba(0,0,0,0.5);
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }

        .input-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }

        .name-selector {
            width: 100%;
            height: 48px;
            padding: 0 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: #fff;
            font-size: 16px;
            cursor: pointer;
            color: #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button.btn-input {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        /* --- MODAL SYSTEM (REVISED FOR SMOOTH ENTRY) --- */
        .modal-overlay {
            display: none; /* Default sembunyi */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 350px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transform: scale(0.85); /* Sedikit kecil saat mulai */
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            overflow: hidden;
        }

        /* State Aktif */
        .modal-overlay.active {
            opacity: 1;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        .modal-header {
            padding: 15px;
            background: #fff;
            border-bottom: 2px solid var(--primary-bg);
            text-align: center;
            font-family: 'Righteous', cursive;
            color: var(--accent-color);
            font-size: 20px;
        }

        .name-list-container {
            max-height: 50vh;
            overflow-y: auto;
        }

        .name-option {
            padding: 18px;
            border-bottom: 1px solid #eee;
            font-size: 18px;
            text-align: center;
            cursor: pointer;
        }
        .name-option:active { background: #f0f0f0; }

        .modal-footer { padding: 15px; }

        .success-card {
            padding: 30px;
            text-align: center;
        }

        /* Monitoring & Footer */
        .monitoring-section {
            width: 100%;
            height: 400px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        iframe { width: 100%; height: 100%; border: none; }
        .footer { height: 80px; font-size: 17px; margin-top: auto; }
    </style>
</head>
<body>

    <div class="header">
        <h1>INPUT DATA TABUNGAN</h1>
    </div>

    <div class="container">
        <div class="input-card">
            <div class="form-group">
                <label>Nama Anak</label>
                <div class="name-selector" onclick="openModal('modal-name-list')">
                    <span id="selected-name-display">-- Pilih Nama --</span>
                    <span style="font-size: 12px; color: #888;">▼</span>
                </div>
                <input type="hidden" id="nama" value="">
            </div>

            <div class="form-group">
                <label>Nominal</label>
                <input type="number" id="nominal" placeholder="Contoh: 10/15/50">
            </div>

            <button class="btn-input" onclick="submitData()">INPUT</button>
        </div>

        <div class="monitoring-section">
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS_eF4NHG4ywPfk82txug2fZgCO-0WrXfkaekeOE5gAYXssITlF-dKo6hFiJ2my7CJSk_HXLfWB_ytU/pubhtml?gid=560169226&single=true"></iframe>
        </div>
    </div>

    <div class="footer">
        <p>Designed by Kamal</p>
    </div>

    <div id="modal-name-list" class="modal-overlay" onclick="closeModal('modal-name-list')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">Pilih Nama</div>
            <div class="name-list-container">
                <div class="name-option" onclick="selectName('Budi')">Budi</div>
                <div class="name-option" onclick="selectName('Dinda')">Dinda</div>
                <div class="name-option" onclick="selectName('Andi')">Andi</div>
                <div class="name-option" onclick="selectName('Amira')">Amira</div>
                <div class="name-option" onclick="selectName('Ziha')">Ziha</div>
                <div class="name-option" onclick="selectName('Dila')">Dila</div>
                <div class="name-option" onclick="selectName('Crisa')">Crisa</div>
                <div class="name-option" onclick="selectName('Faiz')">Faiz</div>
                 <div class="name-option" onclick="selectName('Gilang')">Gilang</div>
                 <div class="name-option" onclick="selectName('Hawari')">Hawari</div>
                 <div class="name-option" onclick="selectName('Rio')">Rio</div>
                 <div class="name-option" onclick="selectName('Rafa')">Rafa</div>
                 <div class="name-option" onclick="selectName('Satya')">Satya</div>
                 <div class="name-option" onclick="selectName('Nafila')">Nafila</div>
                 <div class="name-option" onclick="selectName('Fira')">Fira</div>
                 <div class="name-option" onclick="selectName('Chabibah')">Chabibah</div>
                 <div class="name-option" onclick="selectName('Farel')">Farel</div>
            </div>
            <div class="modal-footer">
                <button onclick="closeModal('modal-name-list')" style="background: #eee; color: #333;" class="btn-input">Batal</button>
            </div>
        </div>
    </div>

    <div id="modal-success" class="modal-overlay">
        <div class="modal-content success-card">
            <div style="font-size: 50px; color: #4CAF50; margin-bottom: 10px;">✓</div>
            <h3>Laporan telah dicatat!</h3>
            <button class="btn-input" onclick="closeSuccessModal()">OKE</button>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyTYyuUAENJLK3p82_LCJ0SaVOpcnrrI6-elsQNi6jVvVTMs_gIEhNGezCrNdIXEvagWA/exec';

        // Fungsi Buka Modal dengan Jaminan Animasi Masuk
        function openModal(id) {
            const modal = document.getElementById(id);
            modal.style.display = 'flex';
            // Menunggu 1 frame agar browser siap menerapkan transisi
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    modal.classList.add('active');
                });
            });
        }

        // Fungsi Tutup Modal
        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        function selectName(val) {
            document.getElementById('nama').value = val;
            document.getElementById('selected-name-display').innerText = val;
            document.getElementById('selected-name-display').style.color = '#000';
            closeModal('modal-name-list');
        }

        function submitData() {
            const nama = document.getElementById('nama').value;
            const nominal = document.getElementById('nominal').value;

            if(!nama || !nominal) {
                alert("Mohon lengkapi data!");
                return;
            }

            const btn = document.querySelector('.btn-input');
            btn.innerHTML = "Mengirim...";
            btn.disabled = true;

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ nama: nama, nominal: nominal }),
            })
            .then(response => {
                openModal('modal-success');
                // Reset form
                document.getElementById('nama').value = '';
                document.getElementById('selected-name-display').innerText = '-- Pilih Nama --';
                document.getElementById('selected-name-display').style.color = '#555';
                document.getElementById('nominal').value = '';
                btn.innerHTML = "INPUT";
                btn.disabled = false;
            })
            .catch(error => {
                alert('Gagal mengirim data!');
                btn.innerHTML = "INPUT";
                btn.disabled = false;
            });
        }

        function closeSuccessModal() {
            closeModal('modal-success');
            const iframe = document.querySelector('iframe');
            iframe.src = iframe.src;
        }
    </script>
</body>
</html>
